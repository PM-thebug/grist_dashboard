<title>Synthèse actions internationales</title>
<!-- API des widgets personnalisés Grist (servie par docs.getgrist.com ; sur une instance
     auto-hébergée, on peut la remplacer par https://<votre-instance>/grist-plugin-api.js) -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root {
  --jaune: #FFEB6E; --bleuf: #00284b; --grisc: #ebf0f5; --grisf: #8296a5;
  --violet: #6941eb; --vert: #b0ee89; --orange: #ffbc75; --bleuc: #9ae2ff;
  --fond: #f6f8fb; --carte: #ffffff; --texte: #00284b; --doux: #5b6f80; --ligne: #dfe6ee;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--texte);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bleuf); color: #fff; padding: 10px 16px 0; }
header h1 { margin: 0 0 8px; font-size: 16px; font-weight: 650; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
header h1 small { font-weight: 400; color: #c9d6e2; font-size: 12px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { border: 0; background: transparent; color: #c9d6e2; padding: 8px 12px; font: inherit; font-weight: 600;
  cursor: pointer; border-radius: 6px 6px 0 0; }
nav button[aria-selected="true"] { background: var(--fond); color: var(--bleuf); }
nav button:hover:not([aria-selected="true"]) { color: #fff; }
.barre-outils { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 16px 0; }
.barre-outils label { display: flex; gap: 6px; align-items: center; color: var(--doux); font-weight: 600; }
select, input[type=number], input[type=search] { font: inherit; color: var(--texte); border: 1px solid var(--ligne);
  border-radius: 6px; padding: 5px 8px; background: #fff; max-width: calc(100vw - 130px); }
button.petit { font: inherit; border: 1px solid var(--ligne); background: #fff; color: var(--texte); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; }
button.petit:hover { border-color: var(--grisf); }
.etat { padding: 8px 16px 0; color: var(--doux); font-size: 12px; }
.etat details { display: inline; }
.etat summary { display: inline; cursor: pointer; color: #9a5b00; font-weight: 600; }
.etat .liste { background: #fff8e0; border: 1px solid #f0d98a; border-radius: 6px; padding: 8px 10px; margin-top: 6px;
  max-height: 220px; overflow: auto; }
main { padding: 12px 16px 32px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); }
.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.carte.large { grid-column: 1 / -1; }
.carte h2 { margin: 0; font-size: 14px; font-weight: 650; }
.carte .st { margin: 2px 0 10px; color: var(--doux); font-size: 12px; }
.tuiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tuile { background: var(--grisc); border-radius: 8px; padding: 7px 10px; min-width: 120px; flex: 1 1 120px; }
.tuile .l { font-size: 11px; color: var(--doux); font-weight: 600; }
.tuile .v { font-size: 17px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.tuile .d { font-size: 11px; color: var(--doux); }
.tuile.jaune { background: var(--jaune); }
.tuile .v.long, .fiche .tuile .v.long { font-size: 13px; }
.vdefil { overflow-x: auto; }
.fiche .tuile { flex-basis: 170px; }
.fiche .tuile .v { font-size: 20px; }
/* Barres horizontales */
.hbarres { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 4px 8px; align-items: center; }
.hbarres .lib { text-align: right; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbarres .piste { height: 16px; display: flex; min-width: 0; }
.hbarres .seg { height: 100%; border: 1px solid transparent; }
.hbarres .seg.clair { border-color: var(--bleuf); }
.hbarres .val { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--doux); }
/* Barres verticales */
.vbarres { display: flex; align-items: flex-end; gap: 6px; height: 230px; padding-top: 18px; border-bottom: 1px solid var(--ligne); }
.vbarres .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.vbarres .b { width: 70%; max-width: 46px; background: var(--bleuf); border: 1px solid transparent; }
.vbarres .b.clair { border-color: var(--bleuf); }
.vbarres .v { font-size: 10.5px; color: var(--doux); white-space: nowrap; margin-bottom: 2px; }
.vlibs { display: flex; gap: 6px; margin-top: 4px; }
.vlibs div { flex: 1 1 0; min-width: 0; font-size: 10.5px; text-align: center; overflow-wrap: anywhere; line-height: 1.2; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 0; font-size: 11.5px; }
.legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px;
  background: var(--c); border: 1px solid var(--b, transparent); }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.deux h3 { font-size: 12px; margin: 0 0 6px; color: var(--doux); }
.types { background: var(--grisc); border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 11.5px; }
.types div { padding: 3px 0; border-top: 1.5px solid #fff; }
.types div:first-child { border-top: 0; }
.types b { margin-right: 6px; }
.types i { color: var(--doux); }
details.tab { margin-top: 10px; }
details.tab summary { cursor: pointer; color: var(--doux); font-weight: 600; font-size: 12px; }
.tablo { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th { text-align: right; background: #D9E1F2; color: #1F3864; padding: 4px 8px; white-space: nowrap; }
td { text-align: right; padding: 3px 8px; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
td.txt { text-align: left; color: var(--doux); }
tbody tr:nth-child(odd) { background: #f3f4f7; }
tr.total td { font-weight: 700; background: #fff; border-top: 1px solid var(--ligne); }
.vide { color: var(--doux); font-style: italic; }
.attente { padding: 40px 16px; color: var(--doux); text-align: center; }
.erreur { padding: 16px; margin: 16px; background: #fff0f0; border: 1px solid #f3b9b9; border-radius: 8px; white-space: pre-wrap; }
@media (max-width: 640px) { .deux { grid-template-columns: 1fr; } .hbarres { grid-template-columns: minmax(80px, 38%) 1fr auto; } }
</style>
</head>
<body>
<header>
  <h1><span id="titre">Synthèse des actions Europe &amp; International</span><small id="sous-titre"></small></h1>
  <nav id="onglets" role="tablist"></nav>
</header>
<div class="barre-outils" id="outils"></div>
<div class="etat" id="etat"></div>
<main id="app"><div class="attente">Chargement des tables Grist…</div></main>

<script>
"use strict";
// ============================================================================
// 1. PARAMÈTRES — mêmes règles que le script R synthese_actions_internationales.R
// ============================================================================
const P = {
  annee: 2026,
  // Libellés des colonnes dans Grist (reconnus sans tenir compte de la casse, des accents
  // ni de la ponctuation ; les identifiants Grist du type MONTANT_2026_ conviennent aussi)
  colonnes: {
    actions: { action: "ACTION", montant: "MONTANT (2026)", categorie: "CATEGORIE D'ACTION",
               type: "TYPE D'ACTION", pays: "PAYS", secteur: "SECTEUR DEI",
               institut: "INSTITUT", institut_nom: "INSTITUT_nom" },
    financements: { action: "Action", source: "Source", annee: "Année", montant: "Montant prévu",
                    montant_norm: "Montant par effectif de 1000 chercheurs" }
  },
  facultatives: ["institut", "institut_nom", "annee", "montant_norm"],
  instituts: ["IN2P3", "INC", "INEE", "INP", "INS2I", "INSB", "INSHS", "INSIS", "INSMI", "INSU"],
  categorieOutils: "OUTILS CNRS",
  categoriesPerimetre: ["OUTILS CNRS", "PLAN AFRIQUE"],
  categorieAfrique: "PLAN AFRIQUE",
  prefixeEnCours: "AAP",
  seuils: {                        // partie 1, par section (mêmes noms que dans R)
    tous: { type_cat: 100000, pays_cat: 100000 },
    outils: { type_cat: 0, pays: 100000 },
    autres: {}
  },
  seuilsFinanceurs: { defaut: 0, pays_autres: 10000 },
  seuilsDEI: { defaut: 0 },
  topPays: 20,
  recodagePays: { "Egypte": "Égypte", "Hong-Kong": "Hong Kong", "Peru": "Pérou",
                  "Tunis": "Tunisie", "Tchéquie": "République Tchèque" },
  sep: ","
};
const C = { jaune: "#FFEB6E", bleuf: "#00284b", grisc: "#ebf0f5", grisf: "#8296a5",
            violet: "#6941eb", vert: "#b0ee89", orange: "#ffbc75", bleuc: "#9ae2ff" };
const PALETTE_CAT = [C.bleuf, C.jaune, C.violet, C.bleuc, C.orange, C.grisf, C.vert];
const CLAIRES = new Set([C.jaune, C.vert, C.orange, C.bleuc, C.grisc]);

// ============================================================================
// 2. OUTILS
// ============================================================================
const NBSP = " ";
const groupe = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
const fmtEuro = v => groupe(v) + NBSP + "€";
const fmtNombre = v => groupe(v);
const fmtPart = v => isFinite(v) ? (v * 100).toFixed(1).replace(".", ",") + NBSP + "%" : "—";
const fmtCourt = v => {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(2).replace(".", ",") + NBSP + "M€";
  if (a >= 1e3) return groupe(v / 1e3) + NBSP + "k€";
  return fmtEuro(v);
};
const fmtK = v => groupe(v / 1e3) + NBSP + "k€";
const squish = s => String(s).replace(/[  ]/g, " ").replace(/\s+/g, " ").trim();
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const sansAccent = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const triAlpha = (a, b) => sansAccent(a).localeCompare(sansAccent(b));
const somme = (rows, f = r => r.montant) => rows.reduce((s, r) => s + f(r), 0);
const distincts = (rows, f = r => r.id) => new Set(rows.map(f)).size;
const nFin = rows => distincts(rows.filter(r => r.montant > 0));
const parties = v => v == null ? [] : String(v).split(P.sep).map(squish).filter(x => x !== "");
const estEnCours = cat => sansAccent(cat || "").replace(/\s/g, "").startsWith(sansAccent(P.prefixeEnCours).replace(/\s/g, ""));
const dansCats = (cat, liste) => liste.map(x => x.toUpperCase()).includes(String(cat || "").toUpperCase());

function nettoyer(v) {
  if (v == null) return null;
  const s = squish(String(v).replace(/^"|"$/g, ""));
  return s === "" ? null : s;
}
function enNombre(v) {
  if (v == null || v === "") return NaN;
  if (typeof v === "number") return v;
  const s = String(v).replace(/[\s  €]/g, "").replace(",", ".");
  return s === "" ? NaN : Number(s);
}
// Construction d'éléments HTML (le texte est toujours inséré comme texte, jamais comme HTML)
function h(tag, attrs, ...enfants) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "style" && typeof v === "object")
      for (const [p, x] of Object.entries(v)) { if (p.startsWith("--")) el.style.setProperty(p, x); else el.style[p] = x; }
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const e of enfants.flat(Infinity)) if (e != null && e !== false) el.append(e instanceof Node ? e : String(e));
  return el;
}

// « Déplie » des colonnes multi-valeurs : une ligne par valeur, montant partagé à parts égales
function deplier(rows, cols) {
  cols = [].concat(cols);
  const out = [];
  for (const r of rows) {
    const listes = cols.map(c => parties(r[c]));
    if (listes.some(l => l.length === 0)) continue;
    const nb = listes.reduce((p, l) => p * l.length, 1);
    let combis = [{}];
    cols.forEach((c, i) => { combis = combis.flatMap(o => listes[i].map(v => ({ ...o, [c]: v }))); });
    for (const o of combis) out.push({ ...r, ...o, montant: r.montant / nb, montant_norm: (r.montant_norm || 0) / nb });
  }
  return out;
}

// ============================================================================
// 3. LECTURE DES TABLES GRIST
// ============================================================================
const cacheTables = {};
async function table(tid) {
  if (!cacheTables[tid]) cacheTables[tid] = await grist.docApi.fetchTable(tid);
  return cacheTables[tid];
}

// Métadonnées : libellé, type et colonne affichée de chaque colonne (si l'accès le permet)
async function lireMeta() {
  try {
    const t = await grist.docApi.fetchTable("_grist_Tables");
    const c = await grist.docApi.fetchTable("_grist_Tables_column");
    const tid = {}; t.id.forEach((id, i) => tid[id] = t.tableId[i]);
    const parId = {}; c.id.forEach((id, i) => parId[id] = { colId: c.colId[i], table: tid[c.parentId[i]] });
    const cols = {};
    c.id.forEach((id, i) => {
      const tab = tid[c.parentId[i]]; if (!tab) return;
      (cols[tab] = cols[tab] || []).push({ colId: c.colId[i], label: c.label[i] || c.colId[i],
        type: c.type[i] || "Any", visibleCol: c.visibleCol ? parId[c.visibleCol[i]] : null });
    });
    return cols;
  } catch (e) { return null; }
}

// Repère la colonne Grist correspondant à un libellé attendu
function trouverColonne(colsTable, libelle) {
  const n = norm(libelle);
  return colsTable.find(c => norm(c.label) === n) || colsTable.find(c => norm(c.colId) === n) || null;
}

// Valeurs d'une colonne, références et listes décodées en texte « a, b »
async function valeurs(tab, col) {
  const data = await table(tab);
  const brut = data[col.colId] || [];
  let ref = null;
  const m = /^Ref(List)?:(.+)$/.exec(col.type || "");
  if (m && col.visibleCol && col.visibleCol.colId) {
    const cible = await table(m[2]);
    ref = new Map(cible.id.map((id, i) => [id, cible[col.visibleCol.colId][i]]));
  }
  const un = v => (ref && typeof v === "number") ? (ref.get(v) ?? null) : v;
  return brut.map(v => {
    if (Array.isArray(v) && v[0] === "L") return v.slice(1).map(un).filter(x => x != null && x !== "").join(", ");
    if (Array.isArray(v)) return null;                 // valeur d'erreur Grist
    return un(v);
  });
}

async function chargerDonnees(options) {
  const meta = await lireMeta();
  const listeTables = (await grist.docApi.listTables()).filter(t => !t.startsWith("_grist"));
  const colonnesDe = async tid => meta && meta[tid] ? meta[tid].filter(c => c.colId !== "manualSort" && !c.colId.startsWith("gristHelper"))
    : Object.keys(await table(tid)).filter(k => k !== "id" && k !== "manualSort").map(k => ({ colId: k, label: k, type: "Any" }));

  // Choix des tables : option du widget, sinon détection par les colonnes
  async function choisir(role, obligatoires) {
    if (options[role] && listeTables.includes(options[role])) return options[role];
    for (const tid of listeTables) {
      const cols = await colonnesDe(tid);
      if (obligatoires.every(l => trouverColonne(cols, l))) return tid;
    }
    return null;
  }
  const ca = P.colonnes.actions, cf = P.colonnes.financements;
  const tA = await choisir("tableActions", [ca.action, ca.montant, ca.categorie]);
  const tF = await choisir("tableFinancements", [cf.action, cf.source, cf.montant]);
  if (!tA || !tF) throw new Error(
    "Tables introuvables. Le widget cherche une table contenant les colonnes " +
    `« ${ca.action} », « ${ca.montant} », « ${ca.categorie} » et une table contenant « ${cf.action} », « ${cf.source} », « ${cf.montant} ».\n` +
    "Tables du document : " + listeTables.join(", ") +
    "\n→ Vérifier l'accès complet au document (Accès : « Accès complet au document ») ou choisir les tables dans les options du widget.");

  async function lire(tid, roles) {
    const cols = await colonnesDe(tid);
    const data = await table(tid);
    const out = { n: data.id.length, manquantes: [] };
    for (const [role, lib] of Object.entries(roles)) {
      const c = trouverColonne(cols, lib);
      if (!c) { if (!P.facultatives.includes(role)) out.manquantes.push(lib); out[role] = new Array(data.id.length).fill(null); }
      else out[role] = await valeurs(tid, c);
    }
    return out;
  }
  const A = await lire(tA, ca), F = await lire(tF, cf);
  const manq = [...A.manquantes.map(x => `${tA} : ${x}`), ...F.manquantes.map(x => `${tF} : ${x}`)];
  if (manq.length) throw new Error("Colonnes introuvables — " + manq.join(" ; "));
  return { tA, tF, A, F };
}

// ============================================================================
// 4. PRÉPARATION — reproduit la section 2 du script R
// ============================================================================
function preparer({ tA, tF, A, F }) {
  const messages = [];
  // --- Actions
  let actions = [];
  let sansMontant = 0;
  for (let i = 0; i < A.n; i++) {
    const montant = enNombre(A.montant[i]);
    const action = nettoyer(A.action[i]);
    if (!isFinite(montant)) { sansMontant++; continue; }
    if (action == null && montant === 0) continue;
    const r = { action, montant, cat: nettoyer(A.categorie[i]), type: nettoyer(A.type[i]),
      pays: nettoyer(A.pays[i]), secteur: nettoyer(A.secteur[i]), institut: nettoyer(A.institut[i]),
      institut_nom: nettoyer(A.institut_nom[i]) };
    r.cle = action == null ? null : squish(action).toUpperCase();
    r.type_cat = r.type == null ? null : `${r.type} (${r.cat ?? "?"})`;
    if (r.pays != null) {
      const p = [...new Set(parties(r.pays).map(x => P.recodagePays[x] || x))];
      r.pays = p.length ? p.join(P.sep) : null;
    }
    actions.push(r);
  }
  actions.forEach((r, i) => r.id = "A" + (i + 1));
  if (sansMontant) messages.push(`${sansMontant} action(s) sans montant numérique ignorée(s)`);

  // Libellés des instituts : code -> INSTITUT_nom le plus fréquent (actions à un seul institut)
  const compte = {};
  for (const r of actions) if (r.institut && r.institut_nom && !r.institut.includes(",")) {
    const code = squish(r.institut.replace(/\(.*\)/, ""));
    (compte[code] = compte[code] || {})[r.institut_nom] = (compte[code][r.institut_nom] || 0) + 1;
  }
  const noms = {};
  for (const [code, o] of Object.entries(compte)) noms[code] = Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
  const lib = code => noms[code] || code;

  // --- Financements
  let fins = [];
  for (let i = 0; i < F.n; i++) {
    const montant = enNombre(F.montant[i]);
    if (!isFinite(montant)) continue;
    const an = parseInt(enNombre(F.annee[i]), 10);
    const source = nettoyer(F.source[i]) ?? "Non renseigné";
    fins.push({ action: nettoyer(F.action[i]), source, annee: isFinite(an) ? an : null, montant,
      montant_norm: (() => { const x = enNombre(F.montant_norm[i]); return isFinite(x) ? x : NaN; })() });
  }
  if (fins.some(f => f.annee != null)) {
    const n0 = fins.length;
    fins = fins.filter(f => f.annee == null || f.annee === P.annee);
    if (fins.length < n0) messages.push(`${n0 - fins.length} financement(s) d'une autre année que ${P.annee} écarté(s)`);
  }
  const parCle = new Map();
  for (const a of actions) if (a.cle) (parCle.get(a.cle) || parCle.set(a.cle, []).get(a.cle)).push(a);
  const baseFin = [], nonRapproches = [];
  for (const f of fins) {
    f.financeur = f.source.includes("DEI") ? "DEI" : f.source.replace(/\s*\(.*\)$/, "");
    const cle = f.action == null ? null : squish(f.action).toUpperCase();
    const cibles = cle ? parCle.get(cle) : null;
    if (!cibles) { nonRapproches.push(f); continue; }
    for (const a of cibles) baseFin.push({ ...f, montant: f.montant / cibles.length,
      montant_norm: f.montant_norm / cibles.length, id: a.id, cat: a.cat, type: a.type,
      type_cat: a.type_cat, pays: a.pays, secteur: a.secteur, institut: a.institut });
  }
  // Base « par institut » : attribution des financements DEI
  const codesInst = x => parties(x || "").map(v => squish(v.replace(/\(.*\)/, ""))).filter(v => P.instituts.includes(v));
  const baseInst = [];
  for (const f of baseFin) {
    const codes = codesInst(f.institut);
    const origine = f.financeur !== "DEI" ? "Institut" : codes.length ? "DEI attribué"
      : estEnCours(f.cat) ? "DEI en cours d'attribution" : "DEI transverse";
    const benef = f.financeur !== "DEI" ? [f.financeur] : codes;
    if (benef.length === 0) baseInst.push({ ...f, origine, benef: null });
    else for (const b of benef) baseInst.push({ ...f, origine, benef: b, montant: f.montant / benef.length });
  }
  const idsFinances = new Set(baseFin.map(f => f.id));
  const sansFin = actions.filter(a => !idsFinances.has(a.id));

  // Couleur fixe par catégorie (ordre du montant total des actions)
  const mCat = {};
  for (const a of actions) if (a.cat) mCat[a.cat] = (mCat[a.cat] || 0) + a.montant;
  const ordreCat = Object.keys(mCat).sort((x, y) => mCat[y] - mCat[x]);
  const couleurCat = {}; ordreCat.forEach((c, i) => couleurCat[c] = PALETTE_CAT[i % PALETTE_CAT.length]);

  return { tA, tF, actions, baseFin, baseInst, nonRapproches, sansFin, messages, lib, ordreCat, couleurCat };
}

// ============================================================================
// 5. CALCULS — un tableau par graphique, avec ses indicateurs (comme dans R)
// ============================================================================
const tuile = (l, v, d, cls) => ({ l, v, d, cls });

// Agrégat d'une dimension (tableau_dimension du script R)
function dimension(rows, col, o = {}) {
  let df = rows;
  if (o.cats) df = df.filter(r => dansCats(r.cat, o.cats));
  if (o.sauf) df = df.filter(r => !dansCats(r.cat, o.sauf));
  const d = o.deplier ? deplier(df, col) : df.filter(r => r[col] != null);
  if (d.length === 0) return null;
  const nTotal = distincts(d);
  const g = new Map();
  for (const r of d) {
    const e = g.get(r[col]) || g.set(r[col], { lib: r[col], montant: 0, ids: new Set() }).get(r[col]);
    e.montant += r.montant; e.ids.add(r.id);
  }
  const totalM = somme(d);
  let tout = [...g.values()].map(e => ({ lib: e.lib, montant: e.montant, n: e.ids.size, part: totalM ? e.montant / totalM : 0 }))
    .sort((a, b) => b.montant - a.montant);
  let lignes = tout;
  if (o.seuil != null) lignes = lignes.filter(e => e.montant > o.seuil);
  if (o.top) lignes = lignes.slice(0, o.top);
  if (lignes.length === 0) return null;
  const nF = nFin(d);
  const tuiles = [
    tuile("Montant total", fmtCourt(totalM)),
    tuile("Nombre d'actions en cours", fmtNombre(o.nUnivers ?? nTotal)),
    tuile("Nombre d'actions financées", fmtNombre(o.nFinUnivers ?? nF), "montant > 0"),
    tuile("Moyenne par action financée", fmtCourt(totalM / nF))
  ];
  if (o.seuil != null || o.top) tuiles.push(tuile(o.top ? `${o.quoi} affichés (top ${o.top})` : `${o.quoi} > ${fmtCourt(o.seuil)}`,
    `${lignes.length} sur ${tout.length}`, `${fmtPart(somme(lignes, e => e.part))} du montant`));
  else tuiles.push(tuile(o.quoi, fmtNombre(tout.length)));
  tuiles.push(tuile("En tête", tout[0].lib, `${fmtPart(tout[0].part)} du montant`));
  if (!o.sansTop3 && tout.length >= 4) tuiles.push(tuile("Part des 3 premiers", fmtPart(tout[0].part + tout[1].part + tout[2].part), "concentration du montant"));
  return { lignes, tout, totalM, nTotal, tuiles, d };
}

function seuilTxt(quoi, s) {
  if (s == null) return null;
  return `${quoi} dont le montant ${s === 0 ? "est supérieur à 0 €" : "dépasse " + fmtEuro(s)}`;
}

let D = null;          // données préparées
let etat = { vue: "global", perimetre: "tous", financeur: null, paysCat: "", paysFin: "", paysSeuil: 0, recherche: "" };

function tuilesEl(ts, fiche) {
  return h("div", { class: "tuiles" + (fiche ? " fiche" : "") },
    ts.filter(Boolean).map(t => h("div", { class: "tuile" + (t.cls ? " " + t.cls : "") },
      h("div", { class: "l" }, t.l), h("div", { class: "v" + (String(t.v).length > 22 ? " long" : "") }, t.v), t.d ? h("div", { class: "d" }, t.d) : null)));
}

function carte(titre, sousTitre, ...contenu) {
  return h("section", { class: "carte" }, h("h2", {}, titre), sousTitre ? h("p", { class: "st" }, sousTitre) : null, contenu);
}

// Barres horizontales ; segments = [{v, c, t}] pour les barres empilées
function hbarres(lignes, { couleur = C.bleuf, segments, valeur = l => l.montant, fmt = fmtCourt } = {}) {
  const max = Math.max(...lignes.map(valeur), 0) || 1;
  return h("div", { class: "hbarres" }, lignes.map(l => {
    const segs = segments ? segments(l) : [{ v: valeur(l), c: couleur }];
    return [
      h("div", { class: "lib", title: l.lib }, l.libAff ?? l.lib),
      h("div", { class: "piste" }, segs.filter(s => s.v > 0).map(s => h("div", {
        class: "seg" + (CLAIRES.has(s.c) ? " clair" : ""), title: `${s.t ? s.t + " — " : ""}${fmtEuro(s.v)}`,
        style: { width: (s.v / max * 100) + "%", background: s.c } }))),
      h("div", { class: "val" }, fmt(valeur(l)))
    ];
  }));
}

function vbarres(lignes, { valeur = l => l.montant, couleur = l => C.bleuf } = {}) {
  const max = Math.max(...lignes.map(valeur), 0) || 1;
  return h("div", { class: "vdefil" }, h("div", { style: { minWidth: (lignes.length * 44) + "px" } },
    h("div", { class: "vbarres" }, lignes.map(l => {
      const c = couleur(l);
      return h("div", { class: "col", title: `${l.libAff ?? l.lib} — ${fmtEuro(valeur(l))}` },
        h("div", { class: "v" }, fmtCourt(valeur(l))),
        h("div", { class: "b" + (CLAIRES.has(c) ? " clair" : ""), style: { height: (valeur(l) / max * 100) + "%", background: c } }));
    })),
    h("div", { class: "vlibs" }, lignes.map(l => h("div", { title: l.libAff ?? l.lib }, l.lib)))));
}

function legendeCat(cats) {
  return h("div", { class: "legende" }, cats.map(c => h("span", { style: { "--c": D.couleurCat[c] || C.grisc,
    "--b": CLAIRES.has(D.couleurCat[c]) ? C.bleuf : "transparent" } }, c)));
}

// Tableau repliable ; colonnes = [[en-tête, fonction, format]]
function tableau(lignes, colonnes, total, ouvert) {
  const fmt = (f, v) => f === "txt" ? (v ?? "") : f(v);
  return h("details", { class: "tab", open: ouvert || null },
    h("summary", {}, "Tableau des données"),
    h("div", { class: "tablo" }, h("table", {},
      h("thead", {}, h("tr", {}, colonnes.map(c => h("th", {}, c[0])))),
      h("tbody", {}, lignes.map(l => h("tr", {}, colonnes.map((c, i) => h("td", { class: c[2] === "txt" && i > 0 ? "txt" : null }, fmt(c[2], c[1](l)))))),
        total ? h("tr", { class: "total" }, colonnes.map((c, i) => h("td", {}, i === 0 ? total.lib : (total[i] != null ? total[i] : "")))) : null))));
}
const colsStd = [["", l => l.libAff ?? l.lib, "txt"], ["Montant", l => l.montant, fmtEuro],
  ["Part du montant", l => l.part, fmtPart], ["Nombre d'actions", l => l.n, fmtNombre],
  ["Montant moyen par action", l => l.montant / l.n, fmtEuro]];
const totalStd = (r, lib = "Total général") => ({ lib, 1: fmtEuro(r.totalM), 2: fmtPart(1), 3: fmtNombre(r.nTotal), 4: fmtEuro(r.totalM / r.nTotal) });

// Carte standard d'une dimension
function carteDimension(titre, rows, col, o = {}) {
  const r = dimension(rows, col, o);
  const st = [o.sousTitre, seuilTxt(o.quoi, o.seuil)].filter(Boolean).join(" — ");
  if (!r) return carte(titre, st, h("p", { class: "vide" }, "Aucune donnée."));
  const t = r.tuiles.slice();
  if (o.tuileExtra) t.splice(1, 0, o.tuileExtra);
  r.lignes.forEach(l => l.libAff = o.libelle ? o.libelle(l.lib) : l.lib);
  return carte(titre, st, tuilesEl(t), hbarres(r.lignes, { couleur: o.couleur || C.bleuf }), o.apres ? o.apres(r) : null,
    tableau(r.lignes, colsStd, totalStd(r, o.libTotal)));
}

// Légende des types d'action par catégorie
function typesParCat(rows, cats) {
  return h("div", { class: "types" }, h("div", { style: { color: C.grisf, fontWeight: 700, fontStyle: "italic" } },
    "Légende — types d'action de chaque catégorie"),
    cats.map(ct => {
      const m = {};
      rows.filter(r => r.cat === ct && r.type).forEach(r => m[r.type] = (m[r.type] || 0) + r.montant);
      const types = Object.keys(m).sort((a, b) => m[b] - m[a] || a.localeCompare(b));
      return h("div", {}, h("b", {}, ct), h("i", {}, types.join("  ·  ")));
    }));
}

// Pays : barres empilées par catégorie + 3 principaux types (tableau_pays_cat)
function cartePaysCat(titre, rows, o) {
  const d = deplier(rows, "pays");
  if (!d.length) return carte(titre, null, h("p", { class: "vide" }, "Aucune donnée."));
  const r = dimension(d, "pays", {});
  const garde = o.seuil == null ? r.tout : r.tout.filter(l => l.montant > o.seuil);
  const comp = {}, types = {};
  for (const x of d) {
    (comp[x.pays] = comp[x.pays] || {})[x.cat || "?"] = (comp[x.pays][x.cat || "?"] || 0) + x.montant;
    if (x.type) (types[x.pays] = types[x.pays] || {})[x.type] = (types[x.pays][x.type] || 0) + x.montant;
  }
  garde.forEach(l => l.types = Object.entries(types[l.lib] || {}).sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([t, m]) => `${t} ${fmtK(m)}`).join(" ; "));
  const cats = D.ordreCat.filter(c => garde.some(l => comp[l.lib][c]));
  const tu = [tuile("Montant total", fmtCourt(r.totalM)),
    tuile("Nombre d'actions en cours", fmtNombre(o.nUnivers ?? r.nTotal)),
    tuile("Nombre d'actions financées", fmtNombre(o.nFinUnivers ?? nFin(d)), "montant > 0"),
    tuile("Nombre d'actions avec pays renseigné", fmtNombre(r.nTotal)),
    tuile(o.seuil == null ? "Pays" : `Pays > ${fmtCourt(o.seuil)}`, `${garde.length} sur ${r.tout.length}`,
      `${fmtPart(somme(garde, l => l.part))} du montant`),
    garde.length ? tuile("En tête", garde[0].lib, `${fmtPart(garde[0].part)} du montant`) : null];
  return carte(titre, ["Toutes les actions — barres découpées par catégorie", seuilTxt("Pays", o.seuil)].filter(Boolean).join(" — "),
    tuilesEl(tu),
    hbarres(garde, { segments: l => cats.map(c => ({ v: comp[l.lib][c] || 0, c: D.couleurCat[c] || C.grisc, t: c })) }),
    legendeCat(cats),
    tableau(garde, [["", l => l.lib, "txt"], ["Montant", l => l.montant, fmtEuro], ["Part du montant", l => l.part, fmtPart],
      ["Nombre d'actions", l => l.n, fmtNombre], ["Principaux types d'action", l => l.types, "txt"]],
      { lib: "Total général (tous pays)", 1: fmtEuro(r.totalM), 2: fmtPart(1), 3: fmtNombre(r.nTotal) }));
}

// Secteur × catégorie (barres empilées)
function carteSecteurCat(titre, rows, o) {
  const d = deplier(rows, "secteur").filter(r => r.cat != null);
  const sansSect = rows.filter(r => r.secteur == null);
  let st = "Toutes les actions, sans filtre de catégorie";
  if (sansSect.length) st += ` — ${distincts(sansSect)} action(s) sans secteur renseigné non représentée(s) (${fmtCourt(somme(sansSect))})`;
  if (!d.length) return carte(titre, st, h("p", { class: "vide" }, "Aucune donnée."));
  const r = dimension(d, "secteur", {});
  const comp = {};
  for (const x of d) (comp[x.secteur] = comp[x.secteur] || {})[x.cat] = (comp[x.secteur][x.cat] || 0) + x.montant;
  const cats = D.ordreCat.filter(c => d.some(x => x.cat === c));
  return carte(titre, st,
    tuilesEl([tuile("Montant total", fmtCourt(r.totalM)), tuile("Nombre d'actions en cours", fmtNombre(o.nUnivers ?? r.nTotal)),
      tuile("Nombre d'actions financées", fmtNombre(o.nFinUnivers ?? nFin(d)), "montant > 0"),
      tuile("Secteurs", fmtNombre(r.tout.length)), tuile("En tête", r.tout[0].lib, `${fmtPart(r.tout[0].part)} du montant`)]),
    hbarres(r.tout, { segments: l => cats.map(c => ({ v: comp[l.lib][c] || 0, c: D.couleurCat[c] || C.grisc, t: c })) }),
    legendeCat(cats),
    tableau(r.tout, [["", l => l.lib, "txt"], ...cats.map(c => [c, l => comp[l.lib][c] || 0, fmtEuro]), ["Total", l => l.montant, fmtEuro]]));
}

// Par financeur (instituts : fonds propres ; DEI : total) — barres verticales
function carteFinanceur(titre, fin, nActions, seuil) {
  const g = {};
  for (const f of fin) { const e = g[f.financeur] = g[f.financeur] || { code: f.financeur, montant: 0, ids: new Set() };
    e.montant += f.montant; if (f.montant > 0) e.ids.add(f.id); }
  const tot = somme(fin);
  let lignes = Object.values(g).map(e => ({ lib: e.code, libAff: D.lib(e.code), montant: e.montant, part: e.montant / tot, n: e.ids.size }))
    .sort((a, b) => b.montant - a.montant);
  const tous = lignes;
  if (seuil != null) lignes = lignes.filter(l => l.montant > seuil);
  if (!lignes.length) return carte(titre, null, h("p", { class: "vide" }, "Aucune donnée."));
  const dei = somme(fin.filter(f => f.financeur === "DEI")), nF = nFin(fin);
  return carte(titre, ["Instituts : fonds propres ; DEI : total de ses financements", seuilTxt("Financeurs", seuil)].filter(Boolean).join(" — "),
    tuilesEl([tuile("Montant total", fmtCourt(tot)), tuile("Nombre d'actions en cours", fmtNombre(nActions)),
      tuile("Nombre d'actions financées", fmtNombre(nF), "montant > 0"), tuile("Moyenne par action financée", fmtCourt(tot / nF)),
      tuile("dont DEI", fmtCourt(dei), `${fmtPart(dei / tot)} du montant`, "jaune"), tuile("Financeurs", fmtNombre(tous.length), "instituts et DEI"),
      tuile("En tête", tous[0].lib, `${fmtPart(tous[0].part)} du montant`)]),
    vbarres(lignes, { couleur: l => l.lib === "DEI" ? C.jaune : C.bleuf }),
    tableau(lignes, [["", l => l.libAff, "txt"], ["Montant", l => l.montant, fmtEuro], ["Part du montant", l => l.part, fmtPart],
      ["Actions financées", l => l.n, fmtNombre]], { lib: "Total général", 1: fmtEuro(tot), 2: fmtPart(1), 3: fmtNombre(nF) }));
}

// Institut : réel et normalisé pour 1000 chercheurs
function carteInstitut(titre, fin) {
  const g = {};
  for (const f of fin.filter(f => P.instituts.includes(f.financeur))) {
    const e = g[f.financeur] = g[f.financeur] || { lib: f.financeur, montant: 0, norm: 0, normOk: false };
    e.montant += f.montant; if (isFinite(f.montant_norm)) { e.norm += f.montant_norm; e.normOk = true; }
  }
  const lignes = Object.values(g);
  if (!lignes.length || !lignes.some(l => l.normOk))
    return carte(titre, null, h("p", { class: "vide" }, "Colonne « Montant par effectif de 1000 chercheurs » vide : graphique normalisé indisponible."));
  lignes.forEach(l => { l.eff = l.norm ? l.montant / l.norm * 1000 : NaN; l.nom = D.lib(l.lib); });
  const reel = lignes.slice().sort((a, b) => b.montant - a.montant);
  const nor = lignes.slice().sort((a, b) => b.norm - a.norm);
  const effTot = somme(lignes.filter(l => isFinite(l.eff)), l => l.eff), totM = somme(lignes);
  return carte(titre, "D'après DEI-FINANCEMENTS : fonds propres des instituts ; effectif déduit du montant normalisé",
    tuilesEl([tuile("Montant total instituts", fmtCourt(totM)), tuile("Effectif total", fmtNombre(effTot), "chercheurs"),
      tuile("Moyenne pour 1000 chercheurs", fmtCourt(totM / effTot * 1000)),
      tuile("1er en montant réel", reel[0].lib, fmtCourt(reel[0].montant)), tuile("1er pour 1000 chercheurs", nor[0].lib, fmtCourt(nor[0].norm))]),
    h("div", { class: "deux" },
      h("div", {}, h("h3", {}, "Montant réel"), hbarres(reel)),
      h("div", {}, h("h3", {}, "Montant pour 1000 chercheurs"), hbarres(nor, { couleur: C.bleuc, valeur: l => l.norm }))),
    tableau(reel, [["", l => l.nom, "txt"], ["Montant réel", l => l.montant, fmtEuro],
      ["Effectif chercheurs", l => l.eff, v => isFinite(v) ? fmtNombre(v) : "—"], ["Montant pour 1000 chercheurs", l => l.norm, fmtEuro]]));
}

// Financement DEI attribué aux instituts
function carteDeiInst(titre, inst, avecRepartition) {
  const d = inst.filter(r => r.origine !== "Institut");
  const att = d.filter(r => r.origine === "DEI attribué");
  if (!d.length) return carte(titre, null, h("p", { class: "vide" }, "Aucun financement DEI."));
  const total = somme(d), attribue = somme(att);

  const lignes = Object.values(g).map(e => ({ ...e, libAff: D.lib(e.lib), part: e.montant / attribue, n: e.ids.size })).sort((a, b) => b.montant - a.montant);
  const rep = avecRepartition ? h("div", { style: { margin: "4px 0 14px" } },

      .map(([l, c]) => h("span", { style: { "--c": c, "--b": C.bleuf } }, l)))) : null;

    tuilesEl([tuile("Montant total DEI", fmtCourt(total)),

    tableau(lignes, [["", l => l.libAff, "txt"], ["Montant DEI attribué", l => l.montant, fmtEuro],
      ["Part du montant attribué", l => l.part, fmtPart], ["Actions financées", l => l.n, fmtNombre]],
      { lib: "Total général", 1: fmtEuro(attribue), 2: fmtPart(1), 3: fmtNombre(nFin(att)) }));

const enTete = (rows, col, dep) => {
  const r = dimension(rows, col, { deplier: dep });
  return r ? { lib: r.tout[0].lib, part: r.tout[0].part, montant: r.tout[0].montant, n: r.tout.filter(l => l.montant > 0).length }
           : { lib: "—", part: NaN, montant: NaN, n: 0 };
};

// Vue 1 : analyse globale (partie 1)
// --------------------------------------------------------------------------
const PERIMETRES = {
  tous: { lib: "Toutes actions", filtre: r => true },
  outils: { lib: P.categoriesPerimetre.join(" et "), filtre: r => dansCats(r.cat, P.categoriesPerimetre) },
  autres: { lib: "Autres actions", filtre: r => !dansCats(r.cat, P.categoriesPerimetre) }
};
function vueGlobale() {
  const p = PERIMETRES[etat.perimetre], S = P.seuils[etat.perimetre];
  const act = D.actions.filter(p.filtre), fin = D.baseFin.filter(p.filtre), inst = D.baseInst.filter(p.filtre);

  const base = { nUnivers: nA, nFinUnivers: nF };
  const cartes = [
    h("section", { class: "carte large" }, h("h2", {}, `${p.lib} — indicateurs clés ${P.annee}`),
      h("p", { class: "st" }, "Montants de la table des actions ; financement DEI d'après DEI-FINANCEMENTS"),
      tuilesEl([tuile("Montant", fmtCourt(somme(act)), `${fmtPart(somme(act) / totalTout)} du montant total`),
        tuile("Nombre d'actions en cours", fmtNombre(nA), "toutes les actions"),
        tuile("Nombre d'actions financées", fmtNombre(nF), "montant > 0"),
        tuile("Moyenne par action financée", fmtCourt(somme(act) / nF)),
        tuile("Financement DEI", fmtCourt(dei), `${fmtPart(dei / somme(fin))} des financements`, "jaune"),
        tuile("1re catégorie", c1.lib, `${fmtPart(c1.part)} du montant`),
        tuile("1er type d'action", t1.lib, `${fmtPart(t1.part)} du montant`),
        tuile("1er institut (DEI incluse)", D.lib(i1.lib), `${fmtPart(i1.part)} du montant`)], true)),
    carteDimension("Par catégorie d'action", act, "cat", { ...base, quoi: "Catégories", seuil: S.categorie,
      apres: r => typesParCat(act, r.lignes.map(l => l.lib)) }),
    carteDimension("Par type d'action (catégorie)", act, "type_cat", { ...base, quoi: "Types d'action", seuil: S.type_cat, libTotal: "Total général (tous types)" })
  ];
  if (etat.perimetre === "tous") cartes.push(cartePaysCat("Par pays (catégories et types d'action)", act, { ...base, seuil: S.pays_cat }));
  cartes.push(carteFinanceur("Par financeur (instituts et DEI)", fin, nA, S.financeur_inst),
    carteInstitut("Par institut CNRS : réel et normalisé pour 1000 chercheurs", fin),
    carteDeiInst("Financement DEI attribué aux instituts", inst, true));
  if (etat.perimetre === "outils") cartes.push(
    carteDimension("Par secteur géographique DEI", act, "secteur", { ...base, deplier: true, quoi: "Secteurs", seuil: S.secteur }),
    carteDimension("Par pays", act, "pays", { ...base, deplier: true, quoi: "Pays", seuil: S.pays, libTotal: "Total général (tous pays)" }));
  return cartes;
}

// --------------------------------------------------------------------------
// Vue 2 : par financeur (partie 2)
// --------------------------------------------------------------------------
function financeurs() {
  const pres = new Set(D.baseFin.map(f => f.financeur));
  return [...P.instituts.filter(i => pres.has(i)), ...(pres.has("DEI") ? ["DEI"] : [])];
}
function univers(f) {
  let d = D.baseFin.filter(x => x.financeur === f);
  if (P.instituts.includes(f)) {
    const ids = new Set(d.map(x => x.id));
    for (const a of D.actions) {
      const codes = parties(a.institut || "").map(v => squish(v.replace(/\(.*\)/, "")));
      if (codes.includes(f) && !ids.has(a.id))
        d.push({ ...a, montant: 0, montant_norm: 0, financeur: f, source: null });
    }
  }
  return d;
}
function syntheseFinanceurs() {
  const totFin = somme(D.baseFin);
  const lignes = financeurs().map(f => {
    const d = univers(f), m = somme(d), nf = nFin(d);
    const outils = somme(d.filter(x => x.cat === P.categorieOutils));
    const dd = D.baseInst.filter(x => x.origine === "DEI attribué" && x.benef === f);
    const pays = enTete(d, "pays", true), type = enTete(d, "type");
    return { lib: f, libAff: D.lib(f), montant: m, part: m / totFin, nC: distincts(d), nF: nf, moy: m / nf, outils: outils / m,
      dei: f === "DEI" ? NaN : somme(dd), nPays: pays.n, pays1: pays.lib, type1: type.lib };
  }).sort((a, b) => b.montant - a.montant);
  return h("section", { class: "carte large" }, h("h2", {}, `Indicateurs clés ${P.annee} — comparaison des financeurs`),
    h("p", { class: "st" }, "D'après DEI-FINANCEMENTS ; actions en cours = actions financées + actions portées non financées"),
    hbarres(lignes, { couleur: C.bleuf, segments: l => [{ v: l.montant, c: l.lib === "DEI" ? C.jaune : C.bleuf }] }),
    tableau(lignes, [["", l => l.libAff, "txt"], ["Montant financé", l => l.montant, fmtEuro], ["Part des financements", l => l.part, fmtPart],
      ["Actions en cours", l => l.nC, fmtNombre], ["Actions financées", l => l.nF, fmtNombre], ["Montant moyen par action financée", l => l.moy, fmtEuro],
      [`Part ${P.categorieOutils}`, l => l.outils, fmtPart], ["Financement DEI attribué", l => l.dei, v => isFinite(v) ? fmtEuro(v) : "—"],
      ["Pays concernés", l => l.nPays, fmtNombre], ["1er pays", l => l.pays1, "txt"], ["1er type d'action", l => l.type1, "txt"]]));
}
function serieFinanceur(f, avecSynthese) {
  const d = univers(f), nU = distincts(d), nFU = nFin(d);
  const estDEI = f === "DEI";
  const S = estDEI ? P.seuilsDEI : P.seuilsFinanceurs;
  const s = nom => S[nom] ?? S.defaut;
  const dd = D.baseInst.filter(x => x.origine === "DEI attribué" && x.benef === f);
  const totFin = somme(D.baseFin), m = somme(d), nf = nFin(d);
  const outils = somme(d.filter(x => x.cat === P.categorieOutils));
  const pays = enTete(d, "pays", true), type = enTete(d, "type"), sect = enTete(d, "secteur", true);
  const attTot = somme(D.baseInst.filter(x => x.origine === "DEI attribué"));
  const tDei = estDEI ? tuile("Attribué aux instituts", fmtCourt(attTot), `${fmtPart(attTot / m)} du montant DEI`, "jaune")
    : tuile("Financement DEI attribué", fmtCourt(somme(dd)), `${fmtNombre(nFin(dd))} actions`, "jaune");
  const extra = estDEI ? null : tuile("Montant alloué par la DEI", fmtCourt(somme(dd)), `${fmtNombre(nFin(dd))} actions`, "jaune");
  const base = { nUnivers: nU, nFinUnivers: nFU, sansTop3: true, tuileExtra: extra };
  const lib = D.lib(f);
  const cartes = [];
  if (avecSynthese) cartes.push(syntheseFinanceurs());
  cartes.push(h("section", { class: "carte large" }, h("h2", {}, `${lib} — indicateurs clés ${P.annee}`), h("p", { class: "st" }, "D'après DEI-FINANCEMENTS"),
      tuilesEl([tuile("Montant", fmtCourt(m), `${fmtPart(m / totFin)} des financements`), tuile("Nombre d'actions en cours", fmtNombre(nU)),
        tuile("Nombre d'actions financées", fmtNombre(nf), "montant > 0"), tuile("Moyenne par action financée", fmtCourt(m / nf)),
        tuile(`Part ${P.categorieOutils}`, fmtPart(outils / m), fmtCourt(outils)), tDei,
        tuile("Pays concernés", fmtNombre(pays.n), "toutes actions"), tuile("1er pays", pays.lib, `${fmtCourt(pays.montant)} — ${fmtPart(pays.part)} du montant`),
        tuile("1er type d'action", type.lib, `${fmtPart(type.part)} du montant`), tuile("1er secteur DEI", sect.lib, `${fmtPart(sect.part)} du montant`)], true)),
    carteDimension(`${lib} — par catégorie d'action`, d, "cat", { ...base, quoi: "Catégories", seuil: s("categorie"),
      apres: r => typesParCat(d, r.lignes.map(l => l.lib)) }),
    carteDimension(`${lib} — par type d'action (catégorie)`, d, "type_cat", { ...base, quoi: "Types d'action", seuil: s("type_cat"), libTotal: "Total général (tous types)" }),
    carteDimension(`${lib} — par secteur géographique DEI`, d, "secteur", { ...base, deplier: true, quoi: "Secteurs", seuil: s("secteur_total"),
      sousTitre: "Toutes les actions, sans filtre de catégorie" }),
    carteSecteurCat(`${lib} — par secteur géographique DEI et catégorie d'action`, d, { nUnivers: nU, nFinUnivers: nFU }),
    carteDimension(`${lib} — par pays, toutes actions`, d, "pays", { ...base, deplier: true, quoi: "Pays", seuil: s("pays_tout"), top: P.topPays,
      libTotal: "Total général (tous pays)", sousTitre: `Toutes les actions, sans filtre de catégorie — ${P.topPays} premiers pays en montant` }),
    carteDimension(`${lib} — par pays, ${P.categorieAfrique}`, d, "pays", { ...base, deplier: true, quoi: "Pays", seuil: s("pays_afrique"),
      cats: [P.categorieAfrique], libTotal: "Total général (tous pays)", sousTitre: `Actions de la catégorie ${P.categorieAfrique}` }),
    carteDimension(`${lib} — par pays, autres actions`, d, "pays", { ...base, deplier: true, quoi: "Pays", seuil: s("pays_autres"),
      sauf: [P.categorieAfrique], libTotal: "Total général (tous pays)", sousTitre: `Toutes les actions hors ${P.categorieAfrique}` }));
  if (!estDEI && dd.length) {
    const b2 = { nUnivers: distincts(dd), nFinUnivers: nFin(dd), sansTop3: true, couleur: C.jaune, seuil: 0 };
    const l2 = `${lib} — financement DEI attribué`;
    cartes.push(
      carteDimension(`${l2} — par catégorie d'action`, dd, "cat", { ...b2, quoi: "Catégories", apres: r => typesParCat(dd, r.lignes.map(l => l.lib)) }),
      carteDimension(`${l2} — par type d'action (catégorie)`, dd, "type_cat", { ...b2, quoi: "Types d'action", libTotal: "Total général (tous types)" }),
      carteDimension(`${l2} — par pays, toutes actions`, dd, "pays", { ...b2, deplier: true, quoi: "Pays", top: P.topPays, libTotal: "Total général (tous pays)",
        sousTitre: `Toutes les actions — ${P.topPays} premiers pays en montant` }));
  }
  return cartes;
}

// --------------------------------------------------------------------------
// Vue 3 : DEI
// --------------------------------------------------------------------------
function vueDEI() {
  const d = D.baseInst.filter(r => r.origine !== "Institut");
  const listeActions = (origine, titre, st) => {
    const rows = d.filter(r => r.origine === origine);
    const g = {};
    for (const r of rows) { const a = D.actions.find(x => x.id === r.id);
      const e = g[r.id] = g[r.id] || { lib: a ? a.action : r.id, cat: r.cat, type: r.type, montant: 0 }; e.montant += r.montant; }
    const lignes = Object.values(g).sort((a, b) => b.montant - a.montant);
    const r2 = dimension(rows, "cat", { quoi: "Catégories" });
    return carte(titre, st, r2 ? hbarres(r2.lignes, { couleur: origine === "DEI transverse" ? C.bleuc : C.orange }) : h("p", { class: "vide" }, "Aucune action."),
      tableau(lignes, [["Action", l => l.lib, "txt"], ["Catégorie", l => l.cat, "txt"], ["Type", l => l.type, "txt"], ["Montant DEI", l => l.montant, fmtEuro]],
        { lib: `Total (${lignes.length} actions)`, 3: fmtEuro(somme(lignes)) }));
  };
  return [
    carteDeiInst("Financement DEI : attribution aux instituts", D.baseInst, true),
    listeActions("DEI en cours d'attribution", "En cours d'attribution — par catégorie", `Actions sans institut dont la catégorie commence par « ${P.prefixeEnCours} »`),
    listeActions("DEI transverse", "Transverse — par catégorie", "Actions sans institut des autres catégories (interdisciplinaires)"),
    ...serieFinanceur("DEI", false)
  ];
}

// --------------------------------------------------------------------------
// Vue 4 : explorateur pays (sans seuil imposé)
// --------------------------------------------------------------------------
function vuePays() {
  let rows = etat.paysFin ? univers(etat.paysFin) : D.actions;
  if (etat.paysCat) rows = rows.filter(r => r.cat === etat.paysCat);
  const nU = distincts(rows), nFU = nFin(rows);
  const r = dimension(rows, "pays", { deplier: true, quoi: "Pays" });
  const source = etat.paysFin ? `Financements de ${D.lib(etat.paysFin)} (DEI-FINANCEMENTS)` : "Montants de la table des actions";
  const st = [source, etat.paysCat ? `Catégorie ${etat.paysCat}` : "Toutes catégories", etat.paysSeuil > 0 ? seuilTxt("Pays", etat.paysSeuil) : null].filter(Boolean).join(" — ");
  if (!r) return [carte("Pays", st, h("p", { class: "vide" }, "Aucune action avec pays pour cette sélection."))];
  const q = sansAccent(etat.recherche || "");
  const visibles = r.tout.filter(l => l.montant > etat.paysSeuil && (!q || sansAccent(l.lib).includes(q)));
  const d = r.d, comp = {};
  for (const x of d) (comp[x.pays] = comp[x.pays] || {})[x.cat || "?"] = (comp[x.pays][x.cat || "?"] || 0) + x.montant;
  const cats = D.ordreCat.filter(c => visibles.some(l => comp[l.lib][c]));
  return [
    h("section", { class: "carte large" }, h("h2", {}, "Montant par pays"), h("p", { class: "st" }, st),
      tuilesEl([tuile("Montant total (pays renseigné)", fmtCourt(r.totalM)), tuile("Nombre d'actions en cours", fmtNombre(nU)),
        tuile("Nombre d'actions financées", fmtNombre(nFU), "montant > 0"), tuile("Nombre d'actions avec pays renseigné", fmtNombre(r.nTotal)),
        tuile("Pays affichés", `${visibles.length} sur ${r.tout.length}`, `${fmtPart(somme(visibles, l => l.part))} du montant`),
        tuile("En tête", r.tout[0].lib, `${fmtPart(r.tout[0].part)} du montant`)]),
      hbarres(visibles, { segments: l => cats.map(c => ({ v: comp[l.lib][c] || 0, c: D.couleurCat[c] || C.grisc, t: c })) }),
      legendeCat(cats),
      tableau(visibles, colsStd, totalStd(r, "Total général (tous pays)"))),
    carteDimension("Par secteur géographique DEI", rows, "secteur", { deplier: true, quoi: "Secteurs", nUnivers: nU, nFinUnivers: nFU, sousTitre: st })
  ];
}

// ============================================================================
// 7. ORCHESTRATION
// ============================================================================
const VUES = { global: "Vue globale", financeur: "Par financeur", dei: "DEI", pays: "Pays" };

function barreOutils() {
  const o = document.getElementById("outils"); o.replaceChildren();
  const sel = (lib, valeur, choix, maj) => h("label", {}, lib, h("select", { onchange: e => { maj(e.target.value); afficher(); } },
    choix.map(([v, l]) => h("option", { value: v, selected: v === valeur || null }, l))));
  if (etat.vue === "global")
    o.append(sel("Périmètre", etat.perimetre, Object.entries(PERIMETRES).map(([k, p]) => [k, p.lib]), v => etat.perimetre = v));
  if (etat.vue === "financeur")
    o.append(sel("Financeur", etat.financeur, financeurs().map(f => [f, D.lib(f)]), v => etat.financeur = v));
  if (etat.vue === "pays") {
    o.append(sel("Catégorie", etat.paysCat, [["", "Toutes"], ...D.ordreCat.map(c => [c, c])], v => etat.paysCat = v),
      sel("Montant", etat.paysFin, [["", "Table des actions"], ...financeurs().map(f => [f, "Financé par " + D.lib(f)])], v => etat.paysFin = v),
      h("label", {}, "Seuil (€)", h("input", { type: "number", min: 0, step: 10000, value: etat.paysSeuil, style: { width: "110px" },
        onchange: e => { etat.paysSeuil = Number(e.target.value) || 0; afficher(); } })),
      h("label", {}, "Rechercher", h("input", { type: "search", value: etat.recherche, placeholder: "pays…",
        oninput: e => { etat.recherche = e.target.value; clearTimeout(window._t); window._t = setTimeout(afficher, 250); } })));
  }
  o.append(h("button", { class: "petit", title: "Relire les tables Grist", onclick: () => demarrer(true) }, "↻ Actualiser"));
  if (window.grist && grist.setOption)
    o.append(h("button", { class: "petit", title: "Ouvrir ce widget sur cette vue par défaut",
      onclick: async e => { try { await grist.setOption("vue", etat.vue); e.target.textContent = "✓ Vue par défaut enregistrée"; }
                            catch (err) { e.target.textContent = "Enregistrement impossible"; } } }, "📌 Vue par défaut"));
}

function bandeauEtat() {
  const e = document.getElementById("etat"); e.replaceChildren();
  e.append(`Tables : ${D.tA} (${D.actions.length} actions) · ${D.tF} (${D.baseFin.length + D.nonRapproches.length} financements ${P.annee}) · `);
  if (D.nonRapproches.length) e.append(h("details", {}, h("summary", {}, `⚠ ${D.nonRapproches.length} financement(s) sans action correspondante, écarté(s) (${fmtCourt(somme(D.nonRapproches))})`),
    h("div", { class: "liste" }, D.nonRapproches.map(f => h("div", {}, `${f.action ?? "(vide)"} — ${f.source} — ${fmtEuro(f.montant)}`)))), " · ");
  if (D.sansFin.length) e.append(h("details", {}, h("summary", { style: { color: "var(--doux)" } }, `${D.sansFin.length} action(s) sans financement (0 €)`),
    h("div", { class: "liste" }, D.sansFin.map(a => h("div", {}, `${a.action ?? "(vide)"} — ${a.cat ?? ""}`)))));
  for (const m of D.messages) e.append(" · " + m);
}

function afficher() {
  const nav = document.getElementById("onglets"); nav.replaceChildren();
  for (const [k, l] of Object.entries(VUES))
    nav.append(h("button", { role: "tab", "aria-selected": String(etat.vue === k), onclick: () => { etat.vue = k; afficher(); } }, l));
  if (!D) return;
  if (!etat.financeur || !financeurs().includes(etat.financeur)) etat.financeur = financeurs()[0];
  barreOutils();
  const app = document.getElementById("app");
  const y = window.scrollY;
  let cartes;
  try {
    cartes = etat.vue === "global" ? vueGlobale() : etat.vue === "financeur" ? serieFinanceur(etat.financeur, true)
      : etat.vue === "dei" ? vueDEI() : vuePays();
  } catch (err) { console.error(err); cartes = [h("div", { class: "erreur" }, "Erreur de calcul : " + err.message)]; }
  app.replaceChildren(...cartes);
  window.scrollTo(0, y);
}

let enCours = null;
async function demarrer(force) {
  if (force) for (const k of Object.keys(cacheTables)) delete cacheTables[k];
  if (enCours) return enCours;
  enCours = (async () => {
    try {
      const brut = await chargerDonnees(OPTIONS);
      D = preparer(brut);
      document.getElementById("sous-titre").textContent = `Synthèse ${P.annee} — données Grist en direct`;
      bandeauEtat();
      afficher();
    } catch (err) {
      console.error(err);
      document.getElementById("app").replaceChildren(h("div", { class: "erreur" }, err.message || String(err)));
    } finally { enCours = null; }
  })();
  return enCours;
}

let OPTIONS = {};
let premier = true;
grist.ready({ requiredAccess: "full", allowSelectBy: false });
function lancer(opts) {
  OPTIONS = opts || {};
  if (premier && OPTIONS.vue && VUES[OPTIONS.vue]) etat.vue = OPTIONS.vue;
  if (premier) { premier = false; demarrer(); }
}
grist.onOptions(opts => lancer(opts));
setTimeout(() => { if (premier) lancer({}); }, 1500);   // si Grist n'envoie pas d'options
// Toute modification de la table liée au widget relance le calcul (tables relues) ;
// le premier envoi, au chargement, est ignoré
let minuterie = null, nbEnvois = 0;
grist.onRecords(() => { if (nbEnvois++ === 0 || premier) return; clearTimeout(minuterie); minuterie = setTimeout(() => demarrer(true), 600); });
afficher();
</script>
